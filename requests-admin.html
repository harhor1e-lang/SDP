<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#081426"><title>الإدارة | متابعة الطلبات</title>
<style>
:root{color-scheme:dark;--gold:#e7c477;--muted:#b8c6d8;--line:#ffffff25}
*{box-sizing:border-box}body{margin:0;padding:16px;font-family:Tahoma,Arial,sans-serif;background:radial-gradient(circle at 15% 5%,#18385a,transparent 34%),linear-gradient(145deg,#06101f,#0b1c33 60%,#090f1e);color:#f5f2e9;min-height:100vh}
main{max-width:1100px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{color:var(--gold);font-weight:900}.muted{color:var(--muted);font-size:12px;line-height:1.8}.panel{background:linear-gradient(145deg,#112945ed,#09182bed);border:1px solid #d8b45a55;border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 18px 45px #0005}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.field{width:100%;padding:11px;border-radius:11px;border:1px solid var(--line);background:#061426;color:white;margin-top:6px;font:inherit}label{font-size:12px;color:#f2dfad;font-weight:700}.btn{border:0;border-radius:11px;padding:11px 15px;background:linear-gradient(120deg,#f0d58f,#b88739);color:#101a28;font-weight:900;cursor:pointer;margin:4px}.alt{background:#ffffff12;color:#f2dfad;border:1px solid #ffffff30}.danger{background:linear-gradient(120deg,#ffb0a8,#bd403b);color:#260807}.notice{padding:11px;border-radius:11px;background:#ffffff0b;border:1px solid var(--line);margin-top:10px;white-space:pre-wrap;line-height:1.8}.hidden{display:none!important}.request{border:1px solid var(--line);border-radius:14px;padding:13px;margin:10px 0;background:#ffffff08}.status{display:inline-block;padding:4px 9px;border-radius:20px;background:#ffffff15;color:#ffe3a0;font-size:11px}.small{font-size:10px;color:var(--muted)}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
</style></head>
<body><main>
<div class="top"><div><div class="brand">🔐 الخصوصية الإشرافية | إعدادية صلاح الدين للبنين</div><div class="muted">مركز إدارة الرسائل والطلبات الواردة من الطلاب وأولياء الأمور</div></div><button class="btn alt" onclick="location.href='index.html'">العودة إلى لوحة الموقع</button></div>
<section class="panel" id="loginPanel"><h2>دخول الإدارة</h2><p class="muted">استخدم رمز الإدارة الحالي نفسه.</p><label>الرمز السري<input id="pin" class="field" type="password" inputmode="numeric" autocomplete="current-password"></label><button class="btn" onclick="login()">دخول</button><div id="loginMsg" class="notice hidden"></div></section>
<div id="adminContent" class="hidden"><section class="panel"><div class="top"><div><h2>📥 الطلبات الواردة</h2><p class="muted">يمكنك تعديل بيانات الطلب أو الرد عليه، وحذف الطلبات القديمة نهائياً.</p></div><button class="btn alt" onclick="loadRequests()">تحديث القائمة</button></div><input id="search" class="field" placeholder="بحث برقم الطلب أو اسم مقدم الطلب أو التفاصيل" oninput="renderRequests()"><div id="requestList" class="notice">جارٍ التحميل...</div></section></div>
</main>
<script>
const U='https://hwkiujezomlvcbfhjdze.supabase.co',K='sb_publishable_1w8y0092CPVn1nT3QfXESQ_PClvh-bz',P=U+'/functions/v1/school-public-portal';
let session=null,rows=[];
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function call(body){const r=await fetch(P,{method:'POST',headers:{'Content-Type':'application/json','apikey':K},body:JSON.stringify(body)});let d={};try{d=await r.json()}catch{}if(!r.ok||d.error)throw new Error(d.error||'تعذر تنفيذ العملية');return d}
async function login(){const m=$('loginMsg');m.classList.remove('hidden');m.textContent='جارٍ التحقق...';try{const d=await fetch(U+'/functions/v1/school-admin-gateway',{method:'POST',headers:{'Content-Type':'application/json','apikey':K},body:JSON.stringify({action:'login',pin:$('pin').value})}).then(x=>x.json());if(!d.ok||!d.session)throw new Error(d.error||'تعذر إنشاء جلسة الإدارة');session=d.session;$('loginPanel').classList.add('hidden');$('adminContent').classList.remove('hidden');await loadRequests()}catch(e){m.textContent='تعذر الدخول: '+e.message}}
const labels={pending:'لم تتم المراجعة بعد',in_review:'قيد المراجعة',needs_info:'يتطلب استكمال معلومات',approved:'تمت الموافقة',rejected:'لم تتم الموافقة',completed:'مكتمل'};
async function loadRequests(){if(!session)return;$('requestList').textContent='جارٍ تحميل الطلبات...';try{const d=await call({action:'admin-list-requests',session});rows=d.requests||[];renderRequests()}catch(e){$('requestList').textContent='تعذر تحميل الطلبات: '+e.message}}
function renderRequests(){const q=$('search').value.trim().toLowerCase(),list=rows.filter(r=>(r.tracking_code+' '+r.applicant_name+' '+r.details+' '+r.request_type).toLowerCase().includes(q));if(!list.length){$('requestList').textContent='لا توجد طلبات مطابقة.';return}
$('requestList').innerHTML=list.map(r=>'<article class="request"><div><b>'+esc(r.tracking_code)+'</b> <span class="status">'+esc(labels[r.status]||r.status)+'</span></div><div class="grid"><label>اسم مقدم الطلب<input class="field" id="nm-'+r.id+'" maxlength="120" value="'+esc(r.applicant_name)+'"></label><label>رقم الهاتف<input class="field" id="ph-'+r.id+'" maxlength="40" value="'+esc(r.contact_phone||'')+'"></label><label>نوع الطلب<input class="field" id="ty-'+r.id+'" maxlength="80" value="'+esc(r.request_type)+'"></label><label>الحالة<select class="field" id="st-'+r.id+'"><option value="pending">لم تتم المراجعة بعد</option><option value="in_review">قيد المراجعة</option><option value="needs_info">يتطلب استكمال معلومات</option><option value="approved">تمت الموافقة</option><option value="rejected">لم تتم الموافقة</option><option value="completed">مكتمل</option></select></label></div><label>نص الطلب<textarea class="field" id="dt-'+r.id+'" rows="4" maxlength="5000">'+esc(r.details)+'</textarea></label><label>رسالة لصاحب الطلب<input class="field" id="pm-'+r.id+'" maxlength="1000" value="'+esc(r.public_message||'')+'"></label><label>ملاحظة داخلية<textarea class="field" id="an-'+r.id+'" rows="2" maxlength="4000">'+esc(r.admin_note||'')+'</textarea></label><div class="actions"><button class="btn" onclick="saveRequest(\''+r.id+'\')">حفظ التعديلات</button><button class="btn danger" onclick="deleteRequest(\''+r.id+'\')">حذف الطلب</button></div><div class="small">تاريخ التقديم: '+esc(new Date(r.created_at).toLocaleString('ar-IQ'))+' · آخر تحديث: '+esc(new Date(r.updated_at||r.created_at).toLocaleString('ar-IQ'))+'</div></article>').join('');
list.forEach(r=>{const el=$('st-'+r.id);if(el)el.value=r.status})}
async function saveRequest(id){const applicantName=$('nm-'+id).value.trim(),details=$('dt-'+id).value.trim(),requestType=$('ty-'+id).value.trim();if(applicantName.length<2||!details||!requestType){alert('يرجى إدخال اسم مقدم الطلب ونوع الطلب والتفاصيل.');return}try{await call({action:'admin-update-request',session,id,applicantName,contactPhone:$('ph-'+id).value.trim(),requestType,details,status:$('st-'+id).value,publicMessage:$('pm-'+id).value,adminNote:$('an-'+id).value});alert('تم حفظ تعديلات الطلب.');await loadRequests()}catch(e){alert('تعذر الحفظ: '+e.message)}}
async function deleteRequest(id){const r=rows.find(x=>x.id===id);if(!r)return;if(!confirm('تأكيد حذف الطلب '+r.tracking_code+' نهائياً؟ لا يمكن التراجع عن الحذف.'))return;try{await call({action:'admin-delete-request',session,id});rows=rows.filter(x=>x.id!==id);renderRequests();alert('تم حذف الطلب.')}catch(e){alert('تعذر حذف الطلب: '+e.message)}}
</script></body></html>
